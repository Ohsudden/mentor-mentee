<div class="dashboard-wrapper">

  <main class="main-content">
    <div class="settings-container">
      <h1 class="settings-title">Settings</h1>

      <div class="settings-card">
        <div class="settings-profile">
          <img
            src="{% if user and user.pp_image %}/static/{{ user.pp_image }}{% else %}/static/img/avatar.png{% endif %}"

            class="profile-avatar"
          />

        <form class="settings-form" id="settingsForm">
          <div class="form-row">
            <div class="form-group">
              <label for="Name">Name</label>
              <input type="text" id="Name" name="Name" placeholder="Your Name" value="{{ user.name if user else '' }}" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="education-level">Education level</label>
              <input type="text" id="education-level" name="education_level" placeholder="Your Education Level" value="{{ user.education_level if user else '' }}" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="age">Age</label>
              <input type="number" id="age" name="age" placeholder="Your Age" value="{{ user.age if user else '' }}" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="gender">Gender</label>
              <input type="text" id="gender" name="gender" placeholder="Your Gender" value="{{ user.gender if user else '' }}" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="role">Role</label>
              <input type="text" id="role" name="role" placeholder="Your Role" value="{{ user.role if user else '' }}" />
            </div>
          </div>
          

          
        </form>
      </div>
    </div>
  </main>
</div>

<script>
async function changeEmail(event) {
  const button = event.currentTarget;
  const emailInput = document.getElementById('email');

  if (!button.dataset.editing) {
    button.dataset.editing = 'true';
    button.textContent = 'Save';
    emailInput.disabled = false;
    emailInput.focus();
    emailInput.select();
    return;
  }

  const newEmail = emailInput.value.trim();

  if (!newEmail) {
    alert('Please enter a valid email address.');
    return;
  }

  const formData = new FormData();
  formData.append('email', newEmail);

  try {
    const response = await fetch('/api/update-email', {
      method: 'POST',
      body: formData
    });

    const result = await response.json();

    if (!response.ok) {
      alert(result?.message || 'Failed to change email.');
      return;
    }

    alert('Email changed successfully.');
    emailInput.disabled = true;
    button.textContent = 'Change';
    delete button.dataset.editing;
  } catch (error) {
    console.error('Error changing email:', error);
    alert('An error occurred. Please try again later.');
  }
}

async function updateNativeLanguage(event) {
  const nativeLanguage = event.target.value;

  try {
    const response = await fetch('/api/update-native-language', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ native_language: nativeLanguage })
    });

    if (response.ok) {
      alert('Native language updated successfully.');
    } else {
      alert('Failed to update native language. Please try again.');
    }
  } catch (error) {
    console.error('Error updating native language:', error);
    alert('An error occurred. Please try again later.');
  }
}

async function updateInterfaceLanguage(event) {
  const interfaceLanguage = event.target.value;

  try {
    const response = await fetch('/api/update-interface-language', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ interface_language: interfaceLanguage })
    });

    if (response.ok) {
      alert('Interface language updated successfully.');
    } else {
      alert('Failed to update interface language. Please try again.');
    }
  } catch (error) {
    console.error('Error updating interface language:', error);
    alert('An error occurred. Please try again later.');
  }
}
</script>
